<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Gaba ISM Schedule App</title>
</head>
<body class="w-screen overflow-x-auto h-dvh bg-main-bg flex flex-col items-center">

    <header class="w-full h-20 md:h-36 flex flex-row justify-center items-center ">

                                              <!-- Title -->

        <h1 class="font-main text-black text-center md:text-2xl  font-bold">GABA ISM SCHEDULE</h1>
    </header>

    <main class="w-full h-dvh min-dvh grow flex flex-col items-center  ">

        <div class="w-full  xl:w-150 h-16  schedule-summary flex flex-col items-center">

            <h2 class="text-base md:text-2xl lg:text-3xl text-left xl:text-center font-main  font-bold">Today's schedule</h2>

            <h3 class="text-sm md:text-base"> <span class="current-date">Aug 24</span>. - <span class="num_of_managers">4 </span>managers listed</h3>
        </div>


                            <!-- Number of ISMs on schedule and number available -->


        <div class="availability-grouping  w-full xl:w-150 h-36 p-3  flex items-center justify-center gap-x-3">

            <div class="on-schedule w-1/2 h-24 border border-muted-border shadow-lg rounded-md flex gap-x-2 justify-center items-center ">
                                            <!-- On schedule -->
                <div class="schedule-icon w-8 h-8 md:w-16 md:h-16  xl:h-16 rounded-full flex items-center justify-center bg-icon-schedule/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-icon-schedule">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>


                </div>

                <div class="schedule-numbers w-2/3  h-16 text-sm md:text-base lg:text-xl flex flex-col gap-y-0 p-1.5">

                    <p class="description text-sm md:text-base font-main">On schedule</p>
                    <p class="number-on-schedule text-lg font-bold font-secondary ">4</p>

                </div>

            </div>
                                            <!-- Available -->
            <div class="available w-1/2 h-24 border border-muted-border shadow-lg rounded-md flex gap-x-2 justify-center items-center ">

                 <div class="schedule-icon w-8 h-8 md:w-16 md:h-16  xl:h-16 rounded-full flex items-center justify-center bg-icon-available/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-emerald-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>



                </div>

                <div class="schedule-numbers w-2/3   h-16 text-sm md:text-base lg:text-xl flex flex-col gap-y-0 p-1.5">

                    <p class="description text-sm md:text-base font-main">Available</p>
                    <p class="number-available text-lg text-foreground font-bold font-secondary ">2</p>

                </div>

            </div>



        </div>
                                                        <!-- Schedule list -->

        <section class="schedule-container w-full xl:w-200 h-auto flex flex-col "> 

            <h3 class="hidden">Instructor list</h3>
                                                        <!-- Schedule card -->

            <div class="instructor-card w-[90%] xl:w-180 h-50 xl:h-50 border border-main-bg shadow-lg mx-auto flex p-2 rounded-xl mt-5">

                <div class="studio-accent-container w-1/4 h-full ">

                    <div class="w-16 h-16 md:w-20 md:h-20 xl:w-28 xl:h-28 rounded-full bg-emerald-500 flex justify-center items-center">

                        <p class="studio-initials uppercase text-base md:text-lg xl:text-xl font-bold font-main">SJW </p>

                    </div>



                </div>

                <div class="instructor-details-container  grow">

                    <div class="instructor-details w-full h-1/2  p-1 flex flex-col items-start justify-start gap-y-2 md:gap-y-1 relative">

                        <p class="name font-bold font-main text-xl md:text-2xl capitalize">Akira Tanaka</p>

                        <p class="studion-details font-secondary text-sm xl:text-base capitalize text-secondary-text">shibuya learning studio</p>

                        <span class="status px-4 py-1 rounded-full xl:flex xl:absolute xl:right-0 text-main-bg font-secondary bg-blue-500 text-xs md:text-sm"> On Schedule</span>

                    </div>

                    <div class="contact-details w-full h-1/2  p-1">
                        <div class="mobile-number w-full h-1/2  flex justify-between items-center">

                            <a href="tel:+818096974633" class="flex flex-row w-full text-secondary-text font-secondary justify-start items-center gap-x-4 xl:gap-x-8"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 md:size-6 xl:size-6 text-blue-500">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
                            </svg><span class="mobile-num text-sm">08096974633</span>
                            </a>


                            <span class="mobile md:hidden text-sm font-secondary text-secondary-text">mobile</span>

                            

                        </div>


                        <!-- Lesson studio contact -->


                        <div class="studio-number w-full h-1/2 flex justify-between items-center">

                            <a href="tel:+818096974633" class="flex flex-row w-full text-secondary-text font-secondary justify-start items-center    gap-x-4 xl:gap-x-8">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 md:size-6 xl:size-6 text-blue-500">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                                </svg>
                                <span class="studio-num text-sm">08096974633</span>
                            </a>


                            <span class="mobile md:hidden text-sm font-secondary text-secondary-text">studio</span>

                            

                        </div>

                    </div>



                </div>

            </div>

        </section>

    </main>


    <footer class="text-center text-sm md:text-base xl:text-lg">&copy; 2026 Eben Kanin</footer>

    




    <script src="./main.js"></script>
</body>
</html>
